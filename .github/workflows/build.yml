name: Build Armbian Image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        rootfs:
          - name: ubuntu-24.04
            armbian_release: noble
          - name: ubuntu-26.04
            armbian_release: resolute
          - name: debian-13
            armbian_release: trixie

    steps:
      - name: Free runner disk space
        uses: descriptinc/free-disk-space@main
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout Armbian build framework
        uses: actions/checkout@v4
        with:
          repository: armbian/build
          path: build

      - name: Checkout customisations
        uses: actions/checkout@v4
        with:
          path: custom

      - name: Merge custom userpatches
        shell: bash
        run: |
          if [ -d custom/userpatches ]; then
            mkdir -p build/userpatches
            rsync -a custom/userpatches/ build/userpatches/
          fi

      - name: Install build requirements
        working-directory: build
        shell: bash
        run: |
          sudo ./compile.sh requirements
          sudo chown -R "$USER:$USER" .

      - name: Build
        working-directory: build
        shell: bash
        run: |
          ./compile.sh \
            BOARD=bananapi \
            RELEASE="${{ matrix.rootfs.armbian_release }}" \
            BRANCH=current \
            BUILD_DESKTOP=no \
            BUILD_MINIMAL=no \
            KERNEL_CONFIGURE=no \
            COMPRESS_OUTPUTIMAGE=xz \
            SHARE_LOGS=no 

      - name: Stage raw U-Boot and kernel boot files
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          rootfs="${{ matrix.rootfs.name }}"
          raw_dir="output/raw/${rootfs}"
          extract_dir=".tmp/extract-${rootfs}"

          mkdir -p "${raw_dir}/u-boot" "${raw_dir}/kernel" "${extract_dir}/u-boot" "${extract_dir}/kernel"

          for deb in output/debs/linux-u-boot-*.deb; do
            [ -e "${deb}" ] || continue
            dpkg-deb -x "${deb}" "${extract_dir}/u-boot"
          done

          while IFS= read -r -d "" file; do
            cp -v "${file}" "${raw_dir}/u-boot/${rootfs}-$(basename "${file}")"
          done < <(find "${extract_dir}/u-boot" -type f \( -name "*.bin" -o -name "u-boot*" -o -name "SPL" \) -print0)

          for deb in output/debs/linux-image-*.deb; do
            [ -e "${deb}" ] || continue
            dpkg-deb -x "${deb}" "${extract_dir}/kernel"
          done

          while IFS= read -r -d "" file; do
            cp -v "${file}" "${raw_dir}/kernel/${rootfs}-$(basename "${file}")"
          done < <(find "${extract_dir}/kernel" -type f -path "*/boot/*" \( -name "uImage*" -o -name "zImage*" \) -print0)

      - name: Upload U-Boot packages
        uses: actions/upload-artifact@v4
        with:
          name: armbian-hummingbird-${{ matrix.rootfs.name }}-u-boot
          path: |
            build/output/debs/linux-u-boot-*.deb
            build/output/raw/${{ matrix.rootfs.name }}/u-boot/**
          if-no-files-found: warn

      - name: Upload kernel packages
        uses: actions/upload-artifact@v4
        with:
          name: armbian-hummingbird-${{ matrix.rootfs.name }}-kernel
          path: |
            build/output/debs/linux-dtb-*.deb
            build/output/debs/linux-headers-*.deb
            build/output/debs/linux-image-*.deb
            build/output/debs/linux-libc-dev-*.deb
            build/output/raw/${{ matrix.rootfs.name }}/kernel/**
          if-no-files-found: warn

      - name: Upload full image
        uses: actions/upload-artifact@v4
        with:
          name: armbian-hummingbird-${{ matrix.rootfs.name }}-image
          path: |
            build/output/images/**
            build/output/logs/**
          if-no-files-found: warn

  release:
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: write
      actions: read

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-assets

          for artifact_dir in release-artifacts/*; do
            [ -d "${artifact_dir}" ] || continue
            artifact_name="$(basename "${artifact_dir}")"
            tar -C "${artifact_dir}" -czf "release-assets/${artifact_name}.tar.gz" .
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: armbian-hummingbird-${{ github.run_number }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create "${RELEASE_TAG}" \
            release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Armbian Hummingbird ${RELEASE_TAG}" \
            --notes "Automated Armbian build for the Allwinner A20 Hummingbird board."
